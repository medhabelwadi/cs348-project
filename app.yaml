runtime: python39
entrypoint: gunicorn -b :$PORT app:app

# Database credentials live in env_variables.yaml, which is git-ignored.
# Copy env_variables.yaml.example to env_variables.yaml and fill in your values.
includes:
  - env_variables.yaml

beta_settings:
  cloud_sql_instances: <PROJECT_ID>:<REGION>:<INSTANCE_NAME>
